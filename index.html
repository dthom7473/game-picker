<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel Game Picker</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
</head>

<body>

    <h1>Spin the Wheel Game Picker</h1>

    <div class="controls">
        <input type="text" id="gameInput" placeholder="Enter a game name">
        <button id="addButton">Add Game</button>
        <button id="spin-btn">Spin</button>
    </div>

    <div id="final-value">Click spin to choose a game</div>

    <div class="wheel-container">
        <canvas id="wheel"></canvas>
        <div class="pointer"></div>
    </div>

    <ul id="gameList"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
